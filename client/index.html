<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Брони — Ресторан</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
</head>
<body>
<header id="header"></header>
<main>
    <div class="row">
        <h1 id="title">Мои брони</h1>
        <span class="spacer"></span>
        <a class="button" href="new-booking.html">+ Забронировать столик</a>
    </div>
    <div id="notice" hidden></div>

    <form id="filters" class="card filters">
        <div>
            <label for="search">Поиск</label>
            <input id="search" name="search" placeholder="Гость, email, комментарий">
        </div>
        <div>
            <label for="status">Статус</label>
            <select id="status" name="status">
                <option value="">Все</option>
                <option value="new">Новая</option>
                <option value="confirmed">Подтверждена</option>
                <option value="completed">Завершена</option>
                <option value="cancelled">Отменена</option>
            </select>
        </div>
        <div>
            <label for="hall_id">Зал</label>
            <select id="hall_id" name="hall_id"><option value="">Все залы</option></select>
        </div>
        <div>
            <label for="date_from">Дата с</label>
            <input id="date_from" name="date_from" type="date">
        </div>
        <div>
            <label for="date_to">Дата по</label>
            <input id="date_to" name="date_to" type="date">
        </div>
        <div>
            <label for="sort">Сортировка</label>
            <select id="sort" name="sort">
                <option value="starts_at">По дате брони</option>
                <option value="guests_count">По числу гостей</option>
                <option value="created_at">По дате создания</option>
            </select>
        </div>
        <div>
            <label for="order">Порядок</label>
            <select id="order" name="order">
                <option value="desc">По убыванию</option>
                <option value="asc">По возрастанию</option>
            </select>
        </div>
        <div>
            <label for="per_page">На странице</label>
            <select id="per_page" name="per_page">
                <option>5</option><option selected>10</option><option>20</option>
            </select>
        </div>
        <div class="row">
            <button type="submit">Применить</button>
            <button type="reset" class="secondary">Сбросить</button>
        </div>
    </form>

    <table>
        <thead>
        <tr>
            <th>№</th><th>Дата и время</th><th>Зал / столик</th><th>Гостей</th>
            <th class="admin-only">Гость</th><th>Статус</th><th>Предзаказ</th><th></th>
        </tr>
        </thead>
        <tbody id="rows"><tr><td colspan="8">Загрузка…</td></tr></tbody>
    </table>
    <div id="pagination" class="pagination"></div>
</main>
<script>
    const form = $('#filters');
    let page = 1;

    async function load() {
        const query = { ...Object.fromEntries(new FormData(form)), page };
        try {
            const res = await api('/v1/bookings', { query });
            $('#rows').innerHTML = res.data.length
                ? res.data.map((b) => `
                    <tr>
                        <td>${b.id}</td>
                        <td>${formatDate(b.starts_at)}<br><span class="muted">до ${formatDate(b.ends_at).split(', ')[1] || ''}</span></td>
                        <td>${escapeHtml(b.table?.hall?.name)}<br><span class="muted">столик №${b.table?.number}</span></td>
                        <td>${b.guests_count}</td>
                        <td class="admin-only">${escapeHtml(b.user?.name)}<br><span class="muted">${escapeHtml(b.user?.email)}</span></td>
                        <td><span class="badge badge-${b.status}">${escapeHtml(b.status_label)}</span></td>
                        <td>${b.preorder_total ? formatMoney(b.preorder_total) : '—'}</td>
                        <td><a href="booking.html?id=${b.id}">Открыть</a></td>
                    </tr>`).join('')
                : '<tr><td colspan="8" class="muted">Броней не найдено</td></tr>';
            renderPagination($('#pagination'), res.meta, (p) => { page = p; load(); });
        } catch (error) {
            handleError(error, form);
        }
    }

    form.addEventListener('submit', (e) => { e.preventDefault(); clearNotice(); page = 1; load(); });
    form.addEventListener('reset', () => setTimeout(() => { page = 1; load(); }));

    (async () => {
        const user = await initLayout();
        if (!user) return;
        if (user.role === 'admin') $('#title').textContent = 'Все брони';
        const halls = await api('/v1/halls', { query: { per_page: 100 } });
        $('#hall_id').insertAdjacentHTML('beforeend',
            halls.data.map((h) => `<option value="${h.id}">${escapeHtml(h.name)}</option>`).join(''));
        load();
    })();
</script>
</body>
</html>
