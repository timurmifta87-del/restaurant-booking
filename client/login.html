<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Вход — Ресторан</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ui.js"></script>
</head>
<body>
<header id="header"></header>
<main>
    <div class="card narrow">
        <h1>Вход</h1>
        <div id="notice" hidden></div>
        <form id="form" novalidate>
            <div class="field">
                <label for="email">Email</label>
                <input id="email" name="email" type="email" required autocomplete="username">
                <small class="field-error" data-for="email"></small>
            </div>
            <div class="field">
                <label for="password">Пароль</label>
                <input id="password" name="password" type="password" required autocomplete="current-password">
                <small class="field-error" data-for="password"></small>
            </div>
            <div class="row">
                <button type="submit">Войти</button>
                <span class="spacer"></span>
                <a href="register.html">Регистрация</a>
            </div>
        </form>
        <p class="muted">Тестовые учётки: admin@resto.test и client@resto.test, пароль password</p>
    </div>
</main>
<script>
    initLayout({ requireAuth: false });
    const form = $('#form');
    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        clearNotice();
        if (!checkRequired(form)) return;
        try {
            const res = await api('/login', {
                method: 'POST',
                body: { email: form.email.value.trim(), password: form.password.value },
            });
            auth.save(res.token, res.user);
            location.href = 'index.html';
        } catch (error) {
            handleError(error, form);
            if (error.status === 401) notify(error.message, 'error');
        }
    });
</script>
</body>
</html>
