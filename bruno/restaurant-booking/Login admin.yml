info:
  name: Login admin
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:8000/api/login
  body:
    type: json
    data: |2-
           {
             "email": "admin@resto.test",
             "password": "password"
           }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body.token) {
               bru.setVar("token", res.body.token);
             }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
